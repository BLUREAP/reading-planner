{% extends "reader/base.html" %}
{% block title %}Удаление книги{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body text-center py-5">
        <h3 class="mb-3">Удалить "{{ book.title }}"?</h3>
        <p class="text-muted mb-4">Все записи о сессиях чтения будут безвозвратно удалены.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Да, удалить</button>
            <a href="{% url 'book_detail' book.id %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
